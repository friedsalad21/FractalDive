<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FractalDive</title>
<meta name="description" content="GPU Mandelbrot / Julia explorer with perturbation deep zoom, smooth palettes and shareable links.">
<style>
  :root { --bg: #05060a; --panel: rgba(14,16,26,.82); --line: rgba(255,255,255,.12); --text: #e8ebf5; --dim: #9aa1b8; --accent: #7cc4ff; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
  canvas#gl.dragging { cursor: grabbing; }
  canvas#gl.julia { cursor: crosshair; }
  #hud { position: fixed; left: 10px; top: 10px; padding: 7px 10px; background: rgba(0,0,0,.45); border-radius: 8px; font: 11.5px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; pointer-events: none; max-width: min(560px, calc(100vw - 80px)); word-break: break-all; backdrop-filter: blur(4px); }
  #hud b { color: var(--accent); font-weight: 600; }
  #hud .dim { color: var(--dim); }
  #bar { position: fixed; left: 0; top: 0; height: 2px; background: var(--accent); width: 0; opacity: .8; pointer-events: none; }
  .fab { position: fixed; right: 12px; display: flex; flex-direction: column; gap: 6px; }
  #zoomBtns { bottom: 12px; }
  .round { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; backdrop-filter: blur(6px); display: grid; place-items: center; }
  .round:hover { border-color: var(--accent); }
  #menuBtn { position: fixed; right: 12px; top: 10px; z-index: 3; }
  #panel { position: fixed; right: 0; top: 0; bottom: 0; width: min(310px, 88vw); background: var(--panel); backdrop-filter: blur(10px); border-left: 1px solid var(--line); padding: 14px 14px 20px; overflow-y: auto; transform: translateX(100%); transition: transform .2s ease; z-index: 2; }
  body.open #panel { transform: none; }
  body.open #zoomBtns { right: calc(min(310px, 88vw) + 12px); }
  #panel h1 { font-size: 17px; margin: 0 0 10px; letter-spacing: .5px; }
  #panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 16px 0 6px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { flex: 0 0 62px; color: var(--dim); }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  select, input[type=number], button.btn { background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  select { width: 100%; }
  select option { background: #151824; }
  button.btn { cursor: pointer; }
  button.btn:hover { border-color: var(--accent); }
  button.btn.on { background: rgba(124,196,255,.2); border-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid2 .btn { width: 100%; text-align: left; }
  #pals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .pal { height: 30px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; position: relative; padding: 0; }
  .pal span { position: absolute; left: 4px; bottom: 1px; font-size: 10px; color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; }
  .pal.on { border-color: #fff; }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #juliaInfo { color: var(--dim); font-size: 12px; word-break: break-all; }
  .keys { color: var(--dim); font-size: 11.5px; line-height: 1.6; }
  .keys kbd { background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font: 11px ui-monospace, monospace; color: var(--text); }
  #inset { position: fixed; left: 12px; bottom: 12px; border: 1px solid rgba(255,255,255,.5); border-radius: 4px; pointer-events: none; display: none; box-shadow: 0 0 0 1px #000; }
  #inset div { position: absolute; left: 0; right: 0; bottom: 100%; font: 10.5px ui-monospace, monospace; color: #fff; text-shadow: 0 0 3px #000; padding-bottom: 2px; white-space: nowrap; overflow: hidden; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(0,0,0,.8); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 5; }
  #toast.show { opacity: 1; }
  #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 30px; font-size: 15px; }
  #test { position: fixed; left: 10px; bottom: 10px; max-width: 90vw; background: #000d; padding: 10px 14px; border-radius: 8px; font: 12px ui-monospace, monospace; z-index: 9; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="bar"></div>
<div id="hud"></div>
<div id="inset"><div></div></div>
<button class="round" id="menuBtn" title="Controls (H)">☰</button>
<div class="fab" id="zoomBtns">
  <button class="round" id="zin" title="Zoom in (+)">+</button>
  <button class="round" id="zout" title="Zoom out (−)">−</button>
  <button class="round" id="zreset" title="Reset view (R)">⟲</button>
</div>
<aside id="panel">
  <h1>FractalDive</h1>
  <h2>Fractal</h2>
  <select id="type">
    <option value="mandel">Mandelbrot</option>
    <option value="ship">Burning Ship</option>
    <option value="tricorn">Tricorn</option>
    <option value="multi3">Multibrot (power 3)</option>
    <option value="multi4">Multibrot (power 4)</option>
    <option value="multi5">Multibrot (power 5)</option>
  </select>
  <div class="row" id="juliaParent">
    <button class="btn" id="jPreview" title="J">Julia preview</button>
    <button class="btn" id="jCentre">Julia at centre</button>
  </div>
  <div id="juliaChild" hidden>
    <div id="juliaInfo"></div>
    <div class="row"><button class="btn" id="jBack">← Back to parent</button></div>
  </div>
  <div class="keys" id="jHint" hidden>Hover to preview, click to open that Julia set.</div>

  <h2>Famous spots</h2>
  <div class="grid2" id="spots"></div>

  <h2>Colour</h2>
  <div id="pals"></div>
  <div class="row"><label>Offset</label><input type="range" id="off" min="0" max="1" step="0.001"></div>
  <div class="row"><label>Density</label><input type="range" id="den" min="-5" max="5" step="0.01"></div>
  <label class="chk"><input type="checkbox" id="cyc"> Cycle colours slowly</label>

  <h2>Iterations</h2>
  <div class="row">
    <label class="chk" style="flex:0 0 auto"><input type="checkbox" id="itAuto"> Auto</label>
    <input type="number" id="it" min="16" max="1000000" step="1" style="flex:1">
  </div>

  <h2>Share &amp; save</h2>
  <div class="row"><button class="btn" id="copy" style="flex:1">Copy link</button></div>
  <div class="row">
    <select id="mult" style="flex:1"><option value="1">Screen size</option><option value="2">2× (wallpaper)</option><option value="4">4× (huge)</option></select>
    <button class="btn" id="save">Save PNG</button>
  </div>
  <div class="row"><button class="btn" id="dive" style="flex:1">▶ Dive here from full view</button></div>

  <h2>Keys</h2>
  <div class="keys">
    Scroll / pinch zoom · drag pan · double-click zoom in (shift: out)<br>
    <kbd>←↑→↓</kbd> pan · <kbd>+</kbd><kbd>−</kbd> zoom · <kbd>R</kbd> reset<br>
    <kbd>P</kbd> palette · <kbd>J</kbd> Julia · <kbd>D</kbd> dive · <kbd>C</kbd> copy link · <kbd>H</kbd> panel · <kbd>Esc</kbd> stop
  </div>
</aside>
<div id="toast"></div>
<div id="err"></div>

<script>
'use strict';
// ---------- high-precision fixed point (BigInt, FRAC fractional bits) ----------
const FRAC = 320, FRACn = 320n, HALF = 1n << (FRACn - 1n);
const toNum = v => Number(v) * 2 ** -FRAC;
const addNum = (v, n) => v + BigInt(Math.round(n * 2 ** FRAC));
function fmt(v, digits) {               // BigInt fixed -> decimal string, rounded, trailing zeros trimmed
  const neg = v < 0n; if (neg) v = -v;
  const n = (v * 10n ** BigInt(digits) + HALF) >> FRACn;
  let s = n.toString().padStart(digits + 1, '0');
  s = (s.slice(0, -digits) + '.' + s.slice(-digits)).replace(/\.?0+$/, '');
  return (neg && n ? '-' : '') + s;
}
function parse(str) {                    // decimal string -> BigInt fixed, or null
  const m = /^\s*(-?)(\d*)(?:\.(\d*))?\s*$/.exec(str || '');
  if (!m || !(m[2] || m[3])) return null;
  const f = (m[3] || '').slice(0, 95), p = 10n ** BigInt(f.length);
  const v = ((BigInt((m[2] || '0') + f) << FRACn) + p / 2n) / p;
  return m[1] ? -v : v;
}
const digitsFor = z => Math.min(90, Math.max(12, Math.ceil(-Math.log10(z)) + 8));

// ---------- state + URL ----------
const TYPES = { mandel: [0, 2], ship: [1, 2], tricorn: [2, 2], multi3: [3, 3], multi4: [3, 4], multi5: [3, 5] };
const HOME = { mandel: ['-0.75', '0', 1.35], ship: ['-0.35', '0.55', 1.75], tricorn: ['-0.25', '0', 1.6], multi3: ['0', '0', 1.4], multi4: ['-0.1', '0', 1.4], multi5: ['0', '0', 1.4], julia: ['0', '0', 1.6] };
const ZMIN = 1e-66, ZMAX = 8;
function defaults(type = 'mandel') {
  const h = HOME[type];
  return { type, julia: false, kx: 0n, ky: 0n, x: parse(h[0]), y: parse(h[1]), z: h[2], it: 0, pal: 'classic', off: 0, den: 1, cyc: false };
}
function encode(s) {
  const D = digitsFor(s.z), q = new URLSearchParams();
  q.set('f', s.type);
  if (s.julia) { q.set('jx', fmt(s.kx, 90)); q.set('jy', fmt(s.ky, 90)); }
  q.set('x', fmt(s.x, D)); q.set('y', fmt(s.y, D)); q.set('z', String(s.z));
  q.set('it', s.it ? String(s.it) : 'auto');
  q.set('pal', s.pal); q.set('off', String(s.off)); q.set('den', String(s.den));
  if (s.cyc) q.set('cyc', '1');
  return q.toString();
}
function decode(hash, base = defaults()) {
  const q = new URLSearchParams(hash.replace(/^#/, '')), s = { ...base };
  const num = (k, lo, hi) => { const v = Number(q.get(k)); return q.has(k) && isFinite(v) && v >= lo && v <= hi ? v : null; };
  if (TYPES[q.get('f')]) s.type = q.get('f');
  const jx = parse(q.get('jx')), jy = parse(q.get('jy'));
  s.julia = jx !== null && jy !== null;
  if (s.julia) { s.kx = jx; s.ky = jy; } else { s.kx = s.ky = 0n; }
  const x = parse(q.get('x')), y = parse(q.get('y'));
  if (x !== null && y !== null) { s.x = x; s.y = y; }
  const z = num('z', ZMIN, ZMAX); if (z) s.z = z;
  const it = q.get('it'); if (it === 'auto') s.it = 0; else if (num('it', 16, 1e6)) s.it = Math.round(num('it', 16, 1e6));
  if (PAL_BY_NAME[q.get('pal')] !== undefined) s.pal = q.get('pal');
  const off = num('off', 0, 1); if (off !== null) s.off = off;
  const den = num('den', 1 / 64, 64); if (den !== null) s.den = den;
  if (q.has('cyc')) s.cyc = q.get('cyc') === '1';
  return s;
}
const autoIter = z => Math.round(250 + 45 * Math.max(0, Math.log10(1.5 / z)) ** 1.65);
let boost = 1, boostZ = 1;               // auto mode doubles iterations when a probe says the view needs more
const maxIter = () => S.it || autoIter(S.z) * (Math.abs(Math.log10(S.z / boostZ)) < 1 ? boost : 1);

// ---------- palettes ----------
const PALETTES = [
  ['classic', ['#000764', '#206bcb', '#edffff', '#ffaa00', '#000200']],
  ['fire', ['#000000', '#3b0000', '#a01000', '#f05a00', '#ffc000', '#fff6c8', '#ff9a00', '#801000']],
  ['ocean', ['#00061a', '#00265c', '#005f8f', '#1fb3c4', '#b8f4f0', '#2a8fb8', '#003a6b']],
  ['neon', ['#05000f', '#ff00c8', '#20004a', '#00f0ff', '#001a40', '#b6ff00', '#2b0030']],
  ['grey', ['#000000', '#ffffff']],
  ['rainbow', ['#ff0000', '#ff9900', '#ffff00', '#33ff00', '#00ffcc', '#0066ff', '#9900ff', '#ff00aa']],
  ['sunset', ['#120024', '#5b0a5e', '#c22d6b', '#ff7a45', '#ffd166', '#ff9e7a', '#7a1f6e']],
  ['forest', ['#030d05', '#0d3b16', '#3f8a2c', '#c6e05a', '#f6e7a1', '#8a5a2b', '#24170a']],
  ['ice', ['#ffffff', '#bfe8ff', '#4aa3df', '#123c8c', '#020a24', '#2c6fbf', '#9fd9ff']],
  ['gold', ['#100800', '#4a2600', '#b8731f', '#ffd27a', '#fff5dd', '#c9963c', '#3a1d05']],
  ['candy', ['#ff5fa2', '#ffd1e8', '#8d5cff', '#3ad8ff', '#fffbe0', '#ff8f5f']],
  ['ink', ['#f4ecd8', '#f4ecd8', '#1b1b2f', '#4b3f72', '#f4ecd8']],
];
const PAL_BY_NAME = Object.fromEntries(PALETTES.map((p, i) => [p[0], i]));
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function paletteBytes() {                 // 256 cyclic samples per palette, one row each
  const out = new Uint8Array(256 * 4 * PALETTES.length);
  PALETTES.forEach(([, stops], r) => {
    const c = stops.map(hex), n = c.length;
    for (let i = 0; i < 256; i++) {
      const t = i / 256 * n, a = Math.floor(t), f = t - a, A = c[a % n], B = c[(a + 1) % n];
      for (let k = 0; k < 3; k++) out[(r * 256 + i) * 4 + k] = Math.round(A[k] + (B[k] - A[k]) * f);
      out[(r * 256 + i) * 4 + 3] = 255;
    }
  });
  return out;
}

// ---------- famous spots ----------
const SPOTS = [
  ['Seahorse Valley', 'f=mandel&x=-0.7453&y=0.1127&z=0.0065'],
  ['Elephant Valley', 'f=mandel&x=0.2925&y=0.0149&z=0.0085'],
  ['Mini-Mandelbrot', 'f=mandel&x=-1.754877666246692760049508896358528691894606617772793143989&y=0&z=0.022'],
  ['Spiral', 'f=mandel&x=-0.7746806106269039&y=-0.1374168856037867&z=1.6e-12'],
  ['Deep mini (1e-15)', 'f=mandel&x=-0.74364388703715887077806454349364257504761&y=0.13182590420531229282109735487476726526299&z=2.5e-15'],
  ['Deep showpiece (1e-32)', 'f=mandel&x=-0.7436438870371587047521915061147797782152562079481812898168839018185607&y=0.1318259042053119704931320563851406789729522793289189662091276774655134&z=2.6e-32&pal=fire&den=0.08'],
  ['Burning Ship armada', 'f=ship&x=-1.7625&y=0.0285&z=0.045'],
  ['Spiral Julia', 'f=mandel&jx=-0.8&jy=0.156&x=0&y=0&z=1.4'],
];

// ---------- GL ----------
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false, depth: false, alpha: false, preserveDrawingBuffer: false });
function fail(msg) { const e = document.getElementById('err'); e.textContent = msg; e.style.display = 'grid'; throw new Error(msg); }
if (!gl) fail('FractalDive needs WebGL 2, which this browser or device does not support.');
if (!gl.getExtension('EXT_color_buffer_float')) fail('FractalDive needs float render targets (EXT_color_buffer_float), which this GPU/browser does not support.');

const VS = `#version 300 es
void main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p * 2. - 1., 0., 1.); }`;

// Iteration pass: perturbation around a reference orbit Z (texture), with Zhuoran's rebasing.
// Deltas are kept in units of 2^E; for very deep zooms (uDeep) they start in a linear, scaled phase
// and switch to plain floats once they are big enough to be normal float32 numbers.
// uZeroRef = 1 means Z == 0 everywhere, which turns the same loop into plain float iteration.
const ITER_FS = TYPE => `#version 300 es
precision highp float; precision highp int;
#define TYPE ${TYPE}
uniform sampler2D uOrbit;
uniform int uPower, uMaxIter, uJulia, uZeroRef, uDeep, uLenA, uRebStart, uRebEnd;
uniform vec2 uImg, uOrigin, uOffset, uJC;
uniform float uPix, uThresh, uUnit, uUnit2;
out vec4 o;
vec2 cmul(vec2 a, vec2 b) { return vec2(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x); }
vec2 Zat(int m) { return uZeroRef == 1 ? vec2(0) : texelFetch(uOrbit, ivec2(m & 2047, m >> 11), 0).xy; }
float diffabs(float a, float b, float s) {   // (|a + s*b| - |a|) / s, exact for s == 0 too
  float ab = a + s*b;
  if (a >= 0.) return ab >= 0. ? b : -(2.*a/s + b);
  return ab > 0. ? 2.*a/s + b : -b;
}
vec2 pstep(vec2 Z, vec2 d, float s) {        // (f(Z + s d) - f(Z)) / s, without the + c
  vec2 z = Z + s*d;
#if TYPE == 1
  return vec2(d.x*(Z.x + z.x) - d.y*(Z.y + z.y), -2.*diffabs(Z.x*Z.y, Z.x*d.y + d.x*z.y, s));
#elif TYPE == 3
  vec2 S = vec2(1, 0), P = vec2(1, 0);
  for (int i = 1; i < uPower; i++) { P = cmul(P, Z); S = cmul(z, S) + P; }
  return cmul(d, S);
#else
  vec2 r = cmul(d, Z + z);
  return TYPE == 2 ? vec2(r.x, -r.y) : r;
#endif
}
void main() {
  vec2 p = (gl_FragCoord.xy + uOrigin - 0.5*uImg) * uPix + uOffset;
  vec2 d = uJulia == 1 ? p : vec2(0), dc = uJulia == 1 ? uJC : p, z = vec2(0);
  float s = uDeep == 1 ? 0. : 1.;
  int m = 0, lim = uLenA - 1, n = 0;
  vec2 Z = Zat(0);
  for (; n < uMaxIter; n++) {
    d = pstep(Z, d, s) + dc;
    m++; Z = Zat(m);
    if (s == 0.) {
      if (max(abs(d.x), abs(d.y)) > uThresh) { d *= uUnit; d *= uUnit2; dc *= uUnit; dc *= uUnit2; s = 1.; }
      else { if (m == lim) { z = Z; break; } continue; }
    }
    z = Z + d;
    float r2 = dot(z, z);
    if (r2 > 65536.) break;
    if (r2 < dot(d, d) || m == lim) { d = z; m = uRebStart; lim = uRebEnd; Z = Zat(m); }
  }
  float r2 = dot(z, z);
  o = vec4(r2 > 65536. ? float(n) - log2(log2(r2) / 16.) / log2(float(uPower)) : -1., 0, 0, 1);
}`;

// Colour pass: iteration value -> palette, bilinear in colour space; rows >= uHiFrom use the hi-res texture.
const COL_FS = `#version 300 es
precision highp float;
uniform sampler2D uHi, uLo, uPal;
uniform vec2 uHiSize, uLoSize, uDst, uDstOrigin;
uniform float uHiFrom, uDensity, uOffset, uRow;
out vec4 o;
vec3 col(float v) { return v < 0. ? vec3(0) : texture(uPal, vec2(v * uDensity + uOffset, uRow)).rgb; }
vec3 samp(sampler2D t, vec2 size, vec2 uv) {
  vec2 q = uv * size - 0.5, f = fract(q);
  ivec2 i = ivec2(floor(q)), mx = ivec2(size) - 1;
  vec3 a = col(texelFetch(t, clamp(i, ivec2(0), mx), 0).r), b = col(texelFetch(t, clamp(i + ivec2(1, 0), ivec2(0), mx), 0).r);
  vec3 c = col(texelFetch(t, clamp(i + ivec2(0, 1), ivec2(0), mx), 0).r), e = col(texelFetch(t, clamp(i + ivec2(1), ivec2(0), mx), 0).r);
  return mix(mix(a, b, f.x), mix(c, e, f.x), f.y);
}
void main() {
  vec2 uv = (gl_FragCoord.xy - uDstOrigin) / uDst;
  o = vec4(gl_FragCoord.y - uDstOrigin.y >= uHiFrom ? samp(uHi, uHiSize, uv) : samp(uLo, uLoSize, uv), 1);
}`;

function program(fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]]) {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) fail('Shader error: ' + gl.getShaderInfoLog(sh));
    gl.attachShader(p, sh);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('Link error: ' + gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}
const iterProgs = {}, iterProg = t => iterProgs[t] || (iterProgs[t] = program(ITER_FS(t)));
const colProg = program(COL_FS);

function tex(w, h, fmt = gl.R32F, filter = gl.NEAREST) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (w) gl.texStorage2D(gl.TEXTURE_2D, 1, fmt, w, h);
  return t;

$('type').onchange = e => { stopDive(); boost = 1; const keep = S; S = { ...defaults(e.target.value), pal: keep.pal, off: keep.off, den: keep.den, cyc: keep.cyc }; parentView = null; setPreview(preview.on); syncUI(); changed(); };
$('jPreview').onclick = () => setPreview(!preview.on);
$('jCentre').onclick = () => openJulia(parse(fmt(S.x, digitsFor(S.z))), parse(fmt(S.y, digitsFor(S.z))));
$('jBack').onclick = leaveJulia;
$('off').oninput = e => { S.off = +e.target.value; dirtyColour = true; scheduleHash(); kick(); };
$('den').oninput = e => { S.den = +(2 ** +e.target.value).toFixed(4); dirtyColour = true; scheduleHash(); kick(); };
$('cyc').onchange = e => { S.cyc = e.target.checked; if (!S.cyc) { S.off = (S.off + colourTime) % 1; colourTime = 0; } syncUI(); scheduleHash(); kick(); };
$('itAuto').onchange = e => { S.it = e.target.checked ? 0 : maxIter(); syncUI(); changed(); };
$('it').onchange = e => { const v = Math.round(+e.target.value); if (v >= 16 && v <= 1e6) { S.it = v; changed(); } syncUI(); };
$('menuBtn').onclick = () => document.body.classList.toggle('open');
$('zin').onclick = () => { stopDive(); zoomAt(innerWidth / 2, innerHeight / 2, 0.5); };
$('zout').onclick = () => { stopDive(); zoomAt(innerWidth / 2, innerHeight / 2, 2); };
$('zreset').onclick = () => { stopDive(); home(); };
$('copy').onclick = copyLink;
$('dive').onclick = startDive;
$('save').onclick = () => savePNG(+$('mult').value);

let hashTimer = 0;
function scheduleHash() { clearTimeout(hashTimer); hashTimer = setTimeout(writeHash, 300); }
function writeHash() { if (!dive) history.replaceState(null, '', '#' + encode(S)); }
async function copyLink() {
  writeHash();
  try { await navigator.clipboard.writeText(location.href); toast('Link copied'); }
  catch { prompt('Copy this link:', location.href); }
}
addEventListener('hashchange', () => { stopDive(); parentView = null; boost = 1; S = decode(location.hash); syncUI(); changed(); });

// ---------- save PNG (tiled, so huge images never stall the GPU) ----------
async function savePNG(mult) {
  if (busy) return;
  stopDive();
  if (S.z <= DIRECT) for (let i = 0; i < 600 && !refOk(ref); i++) { ensureRef(); await new Promise(r => setTimeout(r, 50)); }
  const U = iterUniforms(); if (!U) return toast('Still computing the reference orbit, try again in a moment.');
  busy = true;
  const OW = W * mult, OH = H * mult, it = maxIter(), T = Math.max(64, Math.min(1024, Math.floor(Math.sqrt(3e8 / it))));
  let out, ctx;
  try { out = document.createElement('canvas'); out.width = OW; out.height = OH; ctx = out.getContext('2d'); if (!ctx) throw 0; }
  catch { busy = false; kick(); return toast(`This browser can't make a ${OW}×${OH} image. Try a smaller size.`); }
  const ti = target(T, T, gl.R32F), tc = target(T, T, gl.RGBA8), buf = new Uint8Array(T * T * 4);
  const tiles = Math.ceil(OW / T) * Math.ceil(OH / T);
  let done = 0;
  for (let ty = 0; ty < OH; ty += T) for (let tx = 0; tx < OW; tx += T) {
    const w = Math.min(T, OW - tx), h = Math.min(T, OH - ty);
    iterPass(U, ti, w, h, OW, OH, tx, ty, S.z, it);
    colourPass(tc.fb, [0, 0, w, h], ti.t, [w, h], ti.t, [w, h], 0);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    const img = ctx.createImageData(w, h);
    for (let r = 0; r < h; r++) img.data.set(buf.subarray((h - 1 - r) * w * 4, (h - r) * w * 4), r * w * 4);
    ctx.putImageData(img, tx, OH - ty - h);
    toast(`Rendering ${OW}×${OH}… ${Math.round(++done / tiles * 100)}%`, 0);
    await new Promise(r => setTimeout(r));
  }
  ti.free(); tc.free();
  out.toBlob(b => {
    busy = false; kick();
    if (!b) return toast('Could not encode the PNG (image too large?)');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = `fractaldive-${S.type}${S.julia ? '-julia' : ''}-${fmtZ(S.z)}.png`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast(`Saved ${OW}×${OH} PNG`);
  }, 'image/png');
}

// ---------- self-check: open index.html?test ----------
function selfTest() {
  const lines = [], ok = (c, m) => lines.push((c ? '✓ ' : '✗ ') + m);
  const deep = 'f=mandel&x=-0.7436438870371587047521915061147797782152&y=0.1318259042053119704931320563851406789729&z=2.6e-32&it=40000&pal=fire&off=0.25&den=2.5&cyc=1';
  const jul = 'f=ship&jx=-1.7625000000000000000000000000000000000000001&jy=0.0285&x=0.123456789012345&y=-0.5&z=1.23e-7&it=auto&pal=neon&off=0&den=1';
  for (const h of [deep, jul, encode(defaults())]) {
    const s1 = decode(h), h2 = encode(s1), s2 = decode(h2);
    ok(h2 === h, 'encode(decode(h)) === h  [' + h.slice(0, 40) + '…]');
    ok(Object.keys(s1).every(k => s1[k] === s2[k]), 'decode(encode(state)) restores every field');
  }
  const s = decode(deep);
  ok(fmt(s.x, 40) === '-0.7436438870371587047521915061147797782152' && fmt(s.y, 40) === '0.1318259042053119704931320563851406789729', 'centre keeps all 40 digits at zoom 2.6e-32');
  ok(s.z === 2.6e-32 && s.it === 40000 && s.pal === 'fire' && s.cyc === true, 'zoom, iterations, palette, cycling survive');
  ok(decode(jul).julia && fmt(decode(jul).kx, 43) === '-1.7625000000000000000000000000000000000000001', 'Julia parameter keeps 43 digits');
  const p = parse('-0.1'), q = addNum(p, 1e-40);
  ok(fmt(q, 45) === '-0.0999999999999999999999999999999999999999', 'adding a tiny pan offset keeps precision');
  const pass = lines.every(l => l[0] === '✓');
  console[pass ? 'log' : 'error']('FractalDive self-test:\n' + lines.join('\n'));
  const d = document.createElement('div'); d.id = 'test'; d.textContent = `Self-test ${pass ? 'PASSED' : 'FAILED'}\n` + lines.join('\n');
  document.body.appendChild(d);
  return pass;
}

// ---------- start ----------
if (location.hash.length > 1) S = decode(location.hash);
if (innerWidth >= 900) document.body.classList.add('open');
syncUI();
if (new URLSearchParams(location.search).has('test')) selfTest();
changed();
</script>
